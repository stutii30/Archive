spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:file:./data/archive_dev_db;AUTO_SERVER=TRUE;MODE=MySQL;DB_CLOSE_DELAY=-1;NON_KEYWORDS=YEAR
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        auto_quote_keyword: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
