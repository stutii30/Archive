version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: archive-mysql-prod
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: archive_db
      MYSQL_USER: archive
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-archive_pass}
    volumes:
      - mysql_data_prod:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-31Z
    container_name: archive-minio-prod
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data_prod:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./archive-backend
      dockerfile: Dockerfile
    container_name: archive-backend-prod
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/archive_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: archive
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-archive_pass}
      JWT_SECRET: ${JWT_SECRET:-productionSecretKeyMustBeAtLeast64CharactersLongForHS512AlgorithmToWork!!}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: archive-files
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_PUBLIC_URL: http://localhost:9000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./archive-frontend
      dockerfile: Dockerfile
    container_name: archive-frontend-prod
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  mysql_data_prod:
  minio_data_prod:
